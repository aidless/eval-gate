name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit tests
        run: python3 -m unittest discover -s tests -v
      - name: demo 5 verdicts
        run: python3 -m eval_gate.cli demo --fixtures fixtures --out runs/demo
      - name: rerun 20x (flake check)
        run: python3 scripts/rerun_check.py

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests
        run: python3 -m unittest discover -s tests -v
      - name: demo（10 个场景，逐场景核对 expected）
        run: python3 -m eval_gate.cli demo --out runs/demo
      - name: rerun 20x (flake check)
        run: python3 scripts/rerun_check.py

  types:
    runs-on: ubuntu-latest
    steps:
      - actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: install mypy (pinned)
        run: python3 -m pip install -r requirements.lock
      - name: mypy strict（零错误）
        run: python3 -m mypy

  wheel:
    runs-on: ubuntu-latest
    steps:
      - actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: build wheel
        run: python3 -m pip install build && python3 -m build --wheel
      - name: clean venv install + quickstart
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/eval-gate quickstart --out /tmp/qs
